[package]
name = "fanqie-core"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "cookies", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = { version = "0.25", features = ["parse-woff", "parse-woff2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[dev-dependencies]
